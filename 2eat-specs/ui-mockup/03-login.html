<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>what2eat.food</title>
    <meta name="description" content="Restaurant picker when you cannot decide what to eat" data-i18n="eat.meta.description" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/mockup.css" />
  </head>
  <body class="shell-public" data-title-key="eat.login.title">
    <a class="sr-only" href="#content" data-i18n="eat.a11y.skip">Skip to content</a>
    <div class="shell-locale">
      <div class="locale-switch" role="group" data-i18n="eat.a11y.locale" data-i18n-attr="aria-label">
        <button type="button" data-locale="EN">EN</button>
        <button type="button" data-locale="CN">CN</button>
        <button type="button" data-locale="HK">HK</button>
        <button type="button" data-locale="TW">TW</button>
      </div>
    </div>
    <main id="content" class="auth-main">
      <a class="logo" href="01-home.html" aria-label="what2eat.food">
        <span class="mark-host"><img class="mark" src="assets/food-logo.png" alt="" width="36" height="36" /></span>
        <span class="logo-word">what2eat.food</span>
      </a>
      <h1 data-i18n="eat.login.title">Sign in</h1>
      <p class="error" data-error hidden role="alert" data-i18n="eat.errors.login_failed">Email or password is wrong.</p>
      <form action="06-decide.html" method="get">
        <div class="field">
          <label for="email" data-i18n="eat.login.email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required value="mei@example.com" />
        </div>
        <div class="field">
          <label for="password" data-i18n="eat.login.password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button
              type="button"
              class="password-toggle"
              data-for="password"
              data-i18n="eat.login.show_password"
              data-i18n-attr="aria-label"
              aria-pressed="false"
            >
              <svg class="icon-eye icon-eye--show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye icon-eye--hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>
        <button class="btn" type="submit" data-i18n="eat.login.submit" data-testid="login-submit">Sign in</button>
      </form>
      <p class="auth-links">
        <a href="04-reset.html" data-i18n="eat.login.reset_link">Reset password</a>
        <a href="02-register.html" data-i18n="eat.login.register_link">Create an account</a>
      </p>
    </main>
    <footer class="family-footer">
      <nav class="family-footer__row" aria-label="places.family">
        <span class="family-footer__label">places.family:</span>
        <a class="family-footer__link" href="../../../3.where2play/2play-specs/ui-mockup/01-home.html" target="_blank" rel="noopener noreferrer">
          <img src="assets/play-logo.png" alt="" width="18" height="18" />
          <span>where2play.place</span>
        </a>
        <span class="family-footer__sep" aria-hidden="true">·</span>
        <span class="family-footer__current">
          <img src="assets/food-logo.png" alt="" width="18" height="18" />
          <span>what2eat.food</span>
        </span>
        <span class="family-footer__sep" aria-hidden="true">·</span>
        <a class="family-footer__link" href="../../../1.places-agent/agent-specs/ui-mockup/01-home.html" target="_blank" rel="noopener noreferrer">
          <img src="assets/agent-logo.png" alt="" width="18" height="18" />
          <span>places.agent-mate.ai</span>
        </a>
        <span class="family-footer__sep" aria-hidden="true">·</span>
        <span class="family-footer__copy" data-i18n="eat.footer.copyright">copyright © Ethan Huang</span>
      </nav>
    </footer>
    <script src="assets/i18n.js"></script>
    <script src="assets/mockup.js"></script>
  </body>
</html>
