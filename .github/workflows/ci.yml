name: CI

on:
  push:
    branches: [main, master, real-agent-refactory]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: what2eat
          POSTGRES_PASSWORD: what2eat
          POSTGRES_DB: what2eat
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U what2eat -d what2eat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://what2eat:what2eat@localhost:5435/what2eat
      TEST_DATABASE_URL: postgresql://what2eat:what2eat@localhost:5435/what2eat_test
      SESSION_SECRET: ci-session-secret-32chars-minimum
      FEATURE_EMAIL: "false"
      PUBLIC_BASE_URL: http://localhost:3020
      APP_URL: http://localhost:3020
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client python3-pip

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        run: make db-migrate-test

      - name: Lint
        run: make lint

      - name: Unit and contract tests
        run: make test

      - name: Coverage gate
        run: make test-coverage

      - name: Production build
        run: make build

      # MVP-1 E2E (`make test-e2e-mvp1`) needs a bound places-agent + Playwright
      # browser; keep it in the local Makefile quality gate, not this fixture CI.